[package]
name = "feather-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Encoding, offline joins, and online storage for Feather"

[dependencies]
arrow.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# Heavy and slow to build. Optional so that `cargo check` and the encoding tests
# stay fast; the mise test task uses --all-features.
# Bundled compiles DuckDB from source: roughly 10-15 minutes cold on macOS arm64,
# then cached in target/. `parquet` implies `bundled` and is what gives us
# read_parquet. Note the bundled build excludes ICU, so no date arithmetic that
# needs it (`ts::date`, `now() - interval '1 day'`). Timestamps are handled as
# int64 microseconds and compared with integer arithmetic instead, which avoids
# ICU entirely and is also faster.
#
# `DUCKDB_DOWNLOAD_LIB=1` fetches a prebuilt library instead of compiling this
# one, and it was measured rather than assumed, against the pinned 1.10505.0
# (DuckDB 1.5.5). It does not work here. The build script emits a
# `-Wl,-rpath` for the directory it downloaded into, but cargo does not
# propagate `rustc-link-arg` to a dependent crate's link step, so the result has
# `NEEDED libduckdb.so` and no RUNPATH at all: the binary and a dlopen'ed
# extension both die with "cannot open shared object file" unless
# `LD_LIBRARY_PATH` names the directory. `DUCKDB_STATIC=1` is worse, because the
# `libduckdb_static.a` in the same archive references
# `duckdb::ExtensionHelper::LoadAllExtensions` without defining it, so the link
# fails. And the wheel has to stay self-contained, which rules the flag out
# there whatever the loader does. The lever that works is caching the objects,
# which is what `.cargo/config.toml` does.
duckdb = { workspace = true, optional = true, features = [
  "bundled",
  "parquet",
  # Arrow appender, for getting the entity frame in without per-row work.
  # Costs extra C++ template compilation on a clean build; see the input-mechanism
  # comparison in examples/duckdb_input.rs.
  "appender-arrow",
] }
redis = { workspace = true, optional = true, features = [
  "tokio-comp",
  "connection-manager",
] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# Only for the input-mechanism comparison, which needs to write an Arrow batch to
# Parquet to represent the temp-file route.
parquet.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = []
# Bundled DuckDB. First build compiles DuckDB from source and takes minutes.
offline = ["dep:duckdb"]
# Real Valkey client. Unit tests use the in-memory fake instead.
valkey = ["dep:redis", "dep:tokio"]
full = ["offline", "valkey"]

[[example]]
name = "loadtest"
# Declared here rather than with an inner #![cfg] in the file, which would cfg
# out `main` too and break a plain `cargo test`.
required-features = ["valkey"]

[[example]]
name = "duckdb_input"
# Needs the offline feature for the duckdb crate. Without this, a plain
# `cargo test --features valkey` fails to compile the example.
required-features = ["offline"]

[lib]
doctest = true
