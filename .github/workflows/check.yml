name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide, and that is not only tidiness. rust-cache folds every
# environment variable whose name starts with CARGO, CC, CFLAGS, CXX, CMAKE, or
# RUST into its cache key. Declared inside one job instead, a variable like the
# one below gives that job a different key from every other job on the same
# commit, so the two can never share a cache entry. That is exactly what kept the
# Python jobs from seeing the compiled DuckDB the rust job had already paid for:
# the keys differed by this one variable, and each Python job rebuilt the C++
# from source.
#
# Line tables only. A bundled DuckDB build is the bulk of target/: the static
# archive alone is 1.8GB, and most of that is debug info. Level 2 does not fit on
# a runner and tests never needed variables, but level 1 keeps file and line in
# panic backtraces.
env:
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  # Everything here is seconds of work that used to queue behind the Rust build,
  # so a formatting mistake is reported in about a minute instead of at the end
  # of a six minute job.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags: a tag can be
      # repointed at new code without warning. The version is in the comment.
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # fmt and clippy are components of the toolchain rather than tools, so
      # mise does not treat them as missing, and a mise-action cache hit can
      # leave them uninstalled: the first run died on `cargo-fmt` not being
      # installed for the toolchain. Installing it here is explicit and does not
      # depend on the cache being cold.
      - name: rust components
        run: rustup component add rustfmt
      - name: fmt
        run: cargo fmt --all --check
      # ruff is resolved as a tool rather than taken from the venv, because it is
      # not a dependency: the Python job ran it through `uv run`, which pulls it
      # from uv's tool cache. Same floating version either way, and this way it
      # is on PATH without building the extension first.
      - name: ruff
        run: |
          ruff check python tests
          ruff format --check python tests
      # dprint owns every non-Rust, non-Python file type. Its plugin list lives
      # in dprint.json; this step just checks the tree.
      - name: data files
        run: dprint check

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner image carries tens of gigabytes of SDKs this job never
      # touches, and the DuckDB build filled what was left: the C++ archive step
      # died with "No space left on device" writing libduckdb.a. Removing the
      # trees in parallel costs the largest one rather than their sum.
      - name: free disk space
        run: |
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # The compiled DuckDB is content-addressed here rather than keyed by
      # cargo's unit metadata. Cargo gives libduckdb-sys a build directory per
      # distinct feature set and profile, so a change to either recompiles ~4000
      # C++ translation units: locally that produced five separate 3.3GB builds
      # in one target/ directory. ccache sees the same compile command and
      # returns the object instead, which keeps a cold cargo cache from costing
      # 45 minutes. Nothing here changes the compiler flags, so the linked result
      # is the same as an unassisted build.
      #
      # The key is deliberately stable rather than a hash of Cargo.lock. This
      # repository shares a 10GB cache budget with the cargo cache below, and a
      # rolling key would add roughly a gigabyte per dependency change and
      # eventually evict the entry that matters. The first run fills this with
      # every object a full build produces, which is the whole set. A compiler or
      # duckdb version change simply misses; bump the suffix to start over.
      # renovate: datasource=github-tags depName=actions/cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}
      - name: ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          # Masquerade on PATH rather than CC/CXX in the environment, because
          # those names are part of the rust-cache key and setting them would
          # give this job another key of its own.
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          # Both candidates for ccache's own directory are created and both are
          # cached, so the layout does not depend on whether this image sets
          # XDG_CACHE_HOME.
          mkdir -p "$HOME/.ccache" "$HOME/.cache/ccache"
          ccache --version | head -1
          for cc in gcc g++ cc c++; do
            test -x "/usr/lib/ccache/$cc" ||
              echo "::warning::ccache has no $cc masquerade, the C++ build is uncached"
          done
      # Bundled DuckDB compiles from source on a cold cache: measured on a
      # 2-core runner the rust job takes around 45 minutes, nearly all of it in
      # clippy and test.
      #
      # shared-key overrides the `key` and job-id inputs, so the three jobs ask
      # for one entry instead of one each. It is `rust` and not something newer
      # on purpose: with the profile variable now shared, the Python jobs compute
      # the same key this job has been saving all along, so the existing warm
      # entry is reused rather than rebuilt.
      #
      # Only main saves. A cache entry is scoped to the ref that wrote it, so a
      # pull request writing this same key would not help the next pull request,
      # it would only add another 2.3GB copy and push main's entry toward
      # eviction.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy is a component of the toolchain rather than a tool, so mise does
      # not treat it as missing, and a mise-action cache hit can leave it
      # uninstalled: the first run died on `cargo-fmt` not being installed for
      # the toolchain. Installing it here is explicit and does not depend on the
      # cache being cold.
      - name: rust components
        run: rustup component add clippy
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            -- -D warnings
      # The suite includes the Valkey and RustFS integration tests, which
      # connect eagerly and have no skip guard: with nothing listening they fail
      # rather than skip. docker-compose.yml is reused rather than a bare
      # container so the tests meet the same maxmemory and eviction constraints
      # they are written against, rather than passing on a roomier server than
      # they target. RustFS comes up through the same task a developer runs,
      # because the bucket these tests read from is created there: the image
      # ignores RUSTFS_DEFAULT_BUCKETS and has no bucket-create subcommand. The
      # first remote read installs the httpfs extension from the DuckDB
      # extension repository, so the job needs network beyond those containers.
      - name: valkey and rustfs
        run: |
          mise run valkey:up
          mise run s3:up
      - name: test
        run: cargo test --workspace --all-features
      - name: services down
        if: always()
        run: docker compose down -v
      # Printed so the hit rate is visible rather than assumed. A run that
      # recompiles DuckDB shows up here as misses.
      - name: ccache stats
        if: always()
        run: ccache -s || true

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor and 3.14 is the newest supported.
        # Testing both is the only thing that keeps the floor honest, and
        # this machine has no 3.11 interpreter to check it locally.
        python: ["3.11", "3.14"]
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: pin the interpreter
        run: uv venv --python ${{ matrix.python }}
      # The extension is built, because these tests exercise it: load_settings
      # reads feather.toml through the core, and FeatureStore runs the join
      # through it. That second one means crates/feather-py asks feather-core
      # for the offline engine, so this job pays the bundled DuckDB build it
      # used to skip, on both matrix interpreters. Measured with the archive
      # already in target/, a rebuild takes about four minutes; the rust job's
      # cold-cache figure is around 45. See the cold-build issue.
      #
      # Both matrix entries restore the entry the rust job writes, which is
      # where that archive lives, and fall back to ccache for the C++ objects if
      # it misses. Before the keys were unified each entry compiled the C++
      # itself, and a pull request spent 26 minutes in this job alone.
      #
      # This is also the only place the Python-to-Rust handoff is tested at
      # all: the rust job links the core directly and never loads the
      # extension.
      # renovate: datasource=github-tags depName=actions/cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}
      - name: ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.ccache" "$HOME/.cache/ccache"
          ccache --version | head -1
          for cc in gcc g++ cc c++; do
            test -x "/usr/lib/ccache/$cc" ||
              echo "::warning::ccache has no $cc masquerade, the C++ build is uncached"
          done
      # Restore only. The rust job writes the one entry both matrix entries
      # read, and a second writer with a narrower target directory would only
      # race it.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust
          save-if: false
      - name: sync
        run: uv sync
      # Gating, and not covered by pytest: tests/test_typing_contract.py pins
      # the typed definition API with assert_type and with
      # `# pyrefly: ignore[kind]`, which pyrefly rejects once the ignore stops
      # being needed. pytest only imports that file, so without this step those
      # guarantees go unenforced.
      - name: pyrefly
        run: uv run --no-sync pyrefly check
      - name: pytest
        run: uv run --no-sync pytest
      - name: ccache stats
        if: always()
        run: ccache -s || true
