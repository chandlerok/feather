[workspace]
resolver = "3"
members = ["crates/feather-core", "crates/feather-py", "crates/feather-serve"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
# The thing users install is a wheel from PyPI, not a crate from crates.io, and
# the two are not interchangeable: `cargo publish` would put `feather-core` on
# crates.io under this project's name, where nothing has weighed the API it
# publishes, while the wheel ships the Python package whose import name
# (`feather`) collides with an existing PyPI project.
#
# An invariant rather than a setting, so it holds for a crate added later
# without anyone remembering this comment: `[workspace.package]` is inherited
# by every member, and a member cannot publish unless it says otherwise. The
# first `cargo publish` should be a deliberate one-line change to this file,
# taken at the point it is wanted, not a default that was merely not
# overridden.
#
# `publish = false` is not an error to build with. maturin builds the wheel
# from `crates/feather-py` through this workspace, and neither key touches
# `cargo build`.
publish = false
repository = "https://github.com/chandlerok/feather"
rust-version = "1.85"

[workspace.dependencies]
# Arrow is pinned to 58 because duckdb 1.10505 depends on arrow ^58 and pyo3-arrow
# 0.17 depends on arrow ^58. Mixing Arrow majors produces two incompatible sets of
# types at the FFI boundary, so the whole stack shares one version.
arrow = { version = "58", default-features = false }
# The `arrow` feature is what the Parquet writer needs to take a RecordBatch;
# without the compression features the files are stored plain, which is small
# enough for the demo project and keeps this out of every build's dependency set.
parquet = { version = "58", default-features = false, features = ["arrow"] }
pyo3-arrow = { version = "0.17", default-features = false }

# The serving transport. Flight is gRPC carrying Arrow IPC, so an N-entity
# request is one streamed response rather than N round trips, and a client in
# any language reads it with its own Arrow library rather than a generated shim.
# Same Arrow major as the rest of the stack: two majors in one process do not
# share types at the FFI boundary.
arrow-flight = { version = "58", default-features = false }
duckdb = { version = "~1.10505.0", default-features = false }
# The embedded online store. No runtime and no C++, which is the point: the
# serving path depends on this and not on `duckdb`.
fjall = { version = "3.1", default-features = false }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.53", default-features = false }
tonic = { version = "0.14", default-features = false }

pyo3 = { version = "0.28", default-features = false }

bytes = "1.12"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
