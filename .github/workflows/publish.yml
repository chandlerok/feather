# The upload to PyPI, and the two things an operator has to do before it can
# run. The build half is a near-copy of the `wheel` job in check.yml, and the
# differences are the point: that job proves the README works against one
# linux x86_64 wheel, and this one builds the four platform wheels an install on
# any of them needs.
#
# ## What the operator has to do, and what no commit here can do
#
# Both steps are one-time and both live outside this repository. Until the first
# is done, no tag publishes anything, and neither of those two facts is a
# promise: `publish = false` in the root Cargo.toml leaves no crate for
# `cargo publish` to publish, and the upload job below is gated on a repository
# variable that only someone with settings access can set. This file is what
# gets the repository to the point of being ready; the rest is a human at PyPI.
#
# 1. **Create the PyPI project.** It cannot be named `feather`: that name is
#    taken and already publishes a top-level `feather` module, so an environment
#    holding both installs would get one or the other depending on install
#    order. `feather-py` is the distribution name in `pyproject.toml`; choose
#    the project name deliberately rather than accepting that spelling, because
#    PyPI will not release a name for reuse, so a rename after the first upload
#    is a different project and the old one stays claimed forever.
#
# 2. **Add a trusted publisher** to that project: Settings -> Publishing ->
#    "Add a new publisher" -> GitHub. Fill in this repository, the workflow
#    filename `.github/workflows/publish.yml`, and a `v*` tag ref. That is what
#    makes the upload a short-lived OIDC token, so there is no secret in this
#    repository and adding one would be the wrong fix.
#    https://docs.pypi.org/trusted-publishers/using-a-publisher/
#
# Then open the gate: repository Settings -> Secrets and variables -> Actions ->
# Variables -> New, named `PYPI_PUBLISH`, value `true`. Until that exists the
# upload job reports as skipped, which is the correct state before the project
# name has been approved, and a tag pushed before then costs four builds and
# publishes nothing.
#
# ## Releasing
#
# Bump `version` in `pyproject.toml`, land that, then tag `v<that same version>`
# and push the tag. maturin merges its metadata from Cargo.toml and pyproject.toml
# and pyproject wins, so the Cargo version is the crates.io version, which
# nothing reads now that `publish = false`; the job checks the version in the
# built wheel rather than in either file, so it holds either way. PyPI refuses to
# reuse a version, so a re-tag is not a retry: a failed upload is fixed and
# released as a new version.
#
# `workflow_dispatch` builds all four wheels and skips the upload, which is how
# to check the matrix without spending a tag on it.
name: publish

on:
  push:
    # Only version tags. check.yml triggers on pushes to main, so a tag runs
    # nothing there, and adding tags to that filter would run the whole suite,
    # bundled DuckDB build included, on every tag pushed.
    tags: ["v*"]
  workflow_dispatch:

# No `id-token: write` here. It is on the one job that uploads and nowhere else,
# so a pull request run, which is the shape of every other workflow in this
# repository, never asks GitHub for a token it could use to publish.
permissions:
  contents: read

concurrency:
  # One upload at a time, and never cancelled part way through. PyPI rejects a
  # repeated version outright, so two tags racing would fail one of them for no
  # reason; a cancelled upload is worse still, because what reached PyPI is
  # whatever got there first.
  group: pypi

jobs:
  build:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every platform reports, so one failure does not hide three successes.
      fail-fast: false
      matrix:
        include:
          # 2_28 rather than `auto` on purpose. `auto` takes the lowest the
          # runner's own glibc allows, and ubuntu-latest is 24.04, so the
          # wheel job in check.yml produces a manylinux_2_39 wheel: PyPI accepts
          # that tag, but only a glibc 2.39 system can install it, which is
          # Ubuntu 24.04 and nothing older. 2_28 is Ubuntu 22.04 and RHEL 8, and
          # it is the newest floor a Python 3.11 image on a user's machine
          # plausibly has.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_28"
          # Cross-compiled from an x86_64 runner, not emulated: maturin-action
          # selects the rust-cross container for this target, which carries a
          # real aarch64 toolchain. That is the difference between a build that
          # takes as long as the x86_64 one and one that takes an order of
          # magnitude longer, and it is why this does not need
          # docker/setup-qemu-action.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_28"
          # `macos-15-intel`, not `macos-13`: GitHub removed the macOS 13
          # runners in June 2026 and named this as the migration path, available
          # until August 2027. It is the only x86_64 macOS label, so the two
          # architectures cannot both be served by one label and the matrix has
          # to name them separately.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner image carries tens of gigabytes of SDKs this job never
      # touches, and the DuckDB build fills what is left. The linux wheels build
      # inside a container, but that container's writable layer is on the same
      # disk, so the cleanup is needed for those too. Same deletion, measured at
      # 82s against 127s for the sequential form in the rust job.
      #
      # The macOS runners are the untested case, and it is a real one: they carry
      # 14GB of storage, the same figure that filled on ubuntu-latest, and the
      # directories deleted here are Linux SDKs the macOS images do not have, so
      # there is no equivalent to delete. A macOS build that runs out of disk is
      # the one way this matrix fails that a reviewer would not predict, and
      # sccache is the mitigation until someone measures a macOS build.
      - name: free disk space
        if: runner.os == 'linux'
        run: |
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          df -h /
      # maturin needs an interpreter to build against. This does nothing for
      # the linux jobs, which are containerized, and the macOS runners would
      # otherwise supply whichever `python3` the image happens to ship. The
      # version does not decide the wheel's tag, because abi3 reads it off the
      # pyo3 feature.
      # renovate: datasource=github-tags depName=actions/setup-python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      # Bundled DuckDB compiles from source on a cold cache, around 45 minutes
      # per matrix entry on a 2-core runner, and the four entries do not share
      # a target directory: two Linux architectures and two Darwin triples are
      # four separate compilations of the same C++. Budget an hour and a half
      # for a run, not fifteen minutes, and expect a retry to cost the same
      # without sccache. It is on because the realistic failure is one of four
      # builds dying near the end and the whole run having to be repeated.
      #
      # `strip` is not on this command line. It is `strip = true` in
      # `[tool.maturin]`, which is the only way a publish job cannot forget it.
      #
      # `--compatibility pypi` is maturin's pre-upload check: it is what turns a
      # 255MB unstripped wheel into a build failure instead of a rejection from
      # PyPI, after forty-five minutes of compiling. `--locked` builds from the
      # committed Cargo.lock rather than resolving again.
      # renovate: datasource=github-tags depName=PyO3/maturin-action
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          sccache: true
          # Pinned to the floor pyproject.toml allows, so the artifact is built
          # by a known maturin rather than whatever is newest when the tag lands.
          maturin-version: v1.15.0
          args: >-
            --release --locked --compatibility pypi
            -i python3.11 --out dist
      # One artifact per platform rather than one shared name, because the four
      # wheels differ only in their platform tag and a shared name would have
      # each upload overwrite the last.
      # renovate: datasource=github-tags depName=actions/upload-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Both halves matter and they are different halves. The ref keeps a branch
    # or a `workflow_dispatch` from uploading. The variable is the one the
    # operator sets after the project name is approved, and it is a repository
    # setting rather than a file precisely so that it cannot arrive in a commit
    # from a pull request, or from anyone who can open one.
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    # Not required for the upload to work, and not a third gate. It is here
    # because PyPI recommends it, because the publish action needs an
    # environment to sign its attestations against, and because it is where the
    # operator can later require a manual approval without editing this file.
    environment:
      name: pypi
    permissions:
      # Job-level, on the job that mints the OIDC token and nothing else.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Flattened into one directory because the publish action uploads
      # everything in it and PyPI will not accept a directory of per-platform
      # subfolders. Nothing else may land in here.
      # renovate: datasource=github-tags depName=actions/download-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      # The tag and the artifact have to be the same release, and the cheapest
      # place to learn that is here, before anything is uploaded and before
      # PyPI records the version as taken. All four wheels are read rather than
      # one: a platform silently building from a different checkout is the case
      # where one file looks right and the release is wrong. `pyproject` is
      # printed as well, so a failure says which file to edit rather than
      # leaving the operator to work out which of two 0.0.1s governs.
      - name: the tag and the wheels agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          mapfile -t wheels < <(ls dist/*.whl)
          echo "tag ${GITHUB_REF_NAME}, pyproject ${declared}, ${#wheels[@]} wheels"
          ls -lh dist
          [ "${#wheels[@]}" -eq 4 ] || {
            echo "expected one wheel per matrix entry, got ${#wheels[@]}" >&2
            exit 1
          }
          versions=$(printf '%s\n' "${wheels[@]}" |
            sed -E 's|.*/feather_py-([^-]+)-.*|\1|' | sort -u)
          [ "$(printf '%s\n' "$versions" | wc -l)" -eq 1 ] || {
            echo "the wheels disagree on a version: ${versions}" >&2
            exit 1
          }
          [ "$versions" = "$tag" ] || {
            echo "tag ${GITHUB_REF_NAME} is version ${tag}, the wheels are" \
              "${versions}, pyproject declares ${declared}" >&2
            exit 1
          }
      # No `username` and no `password` input. The action exchanges the OIDC
      # token for a short-lived one by itself, which is the entire reason step 2
      # of the handoff above exists; a token in this repository would be a
      # strictly worse version of the same thing.
      # renovate: datasource=github-tags depName=pypa/gh-action-pypi-publish
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
