---
services:
  # An S3-compatible object store, so the remote-read path meets a real
  # server rather than a mock. Single-node single-disk, which is what RustFS
  # recommends for local testing. No healthcheck: the image's tooling is not
  # guaranteed, and the test waits for readiness itself rather than the
  # compose file guessing at a health endpoint.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Loopback only, and not the documented defaults: the RustFS entrypoint
      # warns that the public default pair is unsafe.
      RUSTFS_ACCESS_KEY: feathertest
      RUSTFS_SECRET_KEY: feathertest
      # No bucket is declared here. This image ignores RUSTFS_DEFAULT_BUCKETS:
      # the variable reaches the container and no bucket appears, and rustfs
      # 1.0.0 has no bucket-create subcommand either. `mise run s3:up` creates
      # the bucket with a signed request instead, and the S3 integration test
      # fails rather than skips when it is missing.
    ports:
      - "127.0.0.1:9000:9000"
    cpus: 2
    mem_limit: 512m
    volumes:
      - rustfs-data:/data

  # A Postgres server, so a warehouse source meets a real database rather than a
  # mock. Ordinary single-node, which is what a developer's own database looks
  # like. Host port 5433 because 5432 is the port a locally installed Postgres
  # already holds on a development machine, and this should not fight it.
  # `pg_isready` is a real healthcheck, so `--wait` waits for the server to accept
  # connections rather than for the container to start.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feathertest
      POSTGRES_PASSWORD: feathertest
      POSTGRES_DB: feathertest
    ports:
      - "127.0.0.1:5433:5432"
    cpus: 2
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "feathertest"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  rustfs-data:
