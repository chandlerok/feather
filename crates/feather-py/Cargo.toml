[package]
name = "feather-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for Feather"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow.workspace = true
# `offline` is a default feature: `FeatureStore` runs the point-in-time join, so
# the engine has to be in the wheel. That means bundled DuckDB, which compiles
# from source, so every build of the extension now pays what this crate used to
# avoid. It also means the Python CI job can no longer skip the C++ build.
feather-core = { path = "../feather-core" }
# No `extension-module` feature here on purpose. maturin sets
# PYO3_BUILD_EXTENSION_MODULE for PyO3 >= 0.27, and enabling the feature
# statically would stop `cargo test` from linking.
# abi3-py311 rather than py312: the Python floor is 3.11 (StrEnum), so one wheel
# covers 3.11 through 3.14. Nothing here needs a newer limited API.
pyo3 = { workspace = true, features = ["abi3-py311"] }
pyo3-arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The online store's I/O is asynchronous, so the binding owns a runtime and blocks on it from
# the Python thread. `rt-multi-thread` because the Valkey client's connection manager drives a
# reactor on its workers; `net` and `time` because that reactor needs them. Optional because
# every use sits behind `offline`: without that feature there is no store for a runtime to
# serve, and an unconditional dependency would make a build carry one it cannot use.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }

[features]
# `valkey` is a default here, unlike in feather-core, because the Python surface is the one a
# project's `feather.toml` is read by: a settings file may declare a Valkey, and a wheel that
# could not use one would fail at the first online call with "this build has no Valkey support".
# Local mode still needs nothing, and the extra dependency is redis plus the tokio the store
# already runs on.
default = ["offline", "valkey"]
# Forwarded so that `cargo test --workspace --all-features` still builds and
# tests the engines, and so a build can drop DuckDB with --no-default-features.
offline = ["feather-core/offline", "dep:tokio"]
valkey = ["feather-core/valkey"]
