# Bundled DuckDB is a C++ build of about 1,500 translation units, and it is most
# of what a cold `cargo` invocation costs: around 45 minutes of the rust job's
# cold run, and the whole of a Python job's `uv sync` after a Cargo.lock change.
# ccache makes the second build of those units nearly free, and its directory at
# `~/.cache/ccache` is per user rather than per worktree, so a worktree-per-agent
# setup shares it without any of them sharing a target directory.
#
# Here rather than in the workflow's `env:`, and that is the whole reason for
# the location. rust-cache folds every variable whose name starts with CARGO, CC,
# CFLAGS, CXX, CMAKE or RUST into its cache key, so a job that set CC in its own
# environment would miss the 2.3GB cargo entry it had already saved. A `[env]`
# table is read by cargo and by the build scripts it runs, never by the action,
# so the keys the existing entries were saved under do not move.
#
# Not `force = true`: an environment variable the developer or a script already
# exported wins, which is how a one-off `CC=clang cargo test` still works.
[env]
CC = "ccache gcc"
CXX = "ccache g++"
# A budget rather than a size. CI uploads this directory to the repository's
# Actions cache, which shares 10GB with the cargo entries, and a full bundled
# build's objects are around a gigabyte. The measured size is in the cold-build
# comment in the workflow.
#
# It bounds what ccache writes and not one byte of what actions/cache restores:
# the cap is read by ccache, and by the time ccache reads it the archive has
# already been extracted, so a job can pull back a directory larger than this
# line. That is why the python job carries a `free disk space` step even though
# its own cargo entry is small. It is not a reason to cap the restore: a
# truncated ccache directory is a partial hit rate, and that job is the one
# this whole mechanism is for.
#
# A `ccache --show-stats` in a CI log reads `Cache size (GiB): 0.0 / 5.0`, and
# 5.0 GiB is ccache's default rather than a sign this line is ignored: a shell
# step's ccache is a process cargo never started, so it inherits no `[env]`
# table, and only the ccache processes cargo spawns during the compile read
# this. The python job's assertion checks the value here against what ccache
# reports for it, so the cap is observed rather than assumed.
CCACHE_MAXSIZE = "3G"
