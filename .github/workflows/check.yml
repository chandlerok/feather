name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # Line tables only. A bundled DuckDB build is the bulk of target/: the
      # static archive alone is 1.8GB, and most of that is debug info. Level 2
      # does not fit on a runner and tests never needed variables, but level 1
      # keeps file and line in panic backtraces.
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      # Actions are pinned to commit SHAs, not moving tags: a tag can be
      # repointed at new code without warning. The version is in the comment.
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner image carries tens of gigabytes of SDKs this job never
      # touches, and the DuckDB build filled what was left: the C++ archive step
      # died with "No space left on device" writing libduckdb.a.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Bundled DuckDB compiles from source on a cold cache: measured on a
      # 2-core runner the rust job takes around 45 minutes, nearly all of it in
      # clippy and test. The build is cached afterwards. DUCKDB_DOWNLOAD_LIB=1
      # would skip the C++ build but links dynamically, and how the dylib is
      # resolved at runtime is unverified, so correctness wins over speed.
      # fmt and clippy are components of the toolchain rather than tools, so
      # mise does not treat them as missing, and a mise-action cache hit can
      # leave them uninstalled: the first run died on `cargo-fmt` not being
      # installed for the toolchain. Installing them here is explicit and does
      # not depend on the cache being cold.
      - name: rust components
        run: rustup component add rustfmt clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            -- -D warnings
      # The suite includes the Valkey integration tests, which connect eagerly
      # and have no skip guard: with nothing listening they fail rather than
      # skip. docker-compose.yml is reused rather than a bare container so the
      # tests meet the same maxmemory and eviction constraints they are written
      # against, rather than passing on a roomier server than they target.
      - name: valkey
        run: docker compose up -d --wait
      - name: test
        run: cargo test --workspace --all-features
      - name: valkey down
        if: always()
        run: docker compose down -v
      - name: data files
        run: mise exec -- dprint check

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor and 3.14 is the newest supported.
        # Testing both is the only thing that keeps the floor honest, and
        # this machine has no 3.11 interpreter to check it locally.
        python: ["3.11", "3.14"]
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: pin the interpreter
        run: uv venv --python ${{ matrix.python }}
      # --no-install-project skips building the Rust extension. This job
      # tests the Python layer, and pytest finds the package through
      # `pythonpath` in pyproject.toml, so no build is needed.
      - name: sync
        run: uv sync --no-install-project
      - name: ruff
        run: |
          uv run --no-sync ruff check python tests
          uv run --no-sync ruff format --check python tests
      # Gating, and not covered by pytest: tests/test_typing_contract.py
      # pins the typed definition API with assert_type and with
      # `# type: ignore[code]`, which mypy rejects once it stops being
      # needed. pytest only imports that file, so without this step those
      # guarantees go unenforced.
      - name: mypy
        run: uv run --no-sync mypy
      - name: pytest
        run: uv run --no-sync pytest
