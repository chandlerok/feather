[package]
name = "feather-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Encoding, offline joins, and online storage for Feather"

[dependencies]
arrow.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# Heavy and slow to build. Optional so that `cargo check` and the encoding tests
# stay fast; the mise test task uses --all-features.
# Bundled compiles DuckDB from source: roughly 10-15 minutes cold on macOS arm64,
# then cached in target/. `parquet` implies `bundled` and is what gives us
# read_parquet. Note the bundled build excludes ICU, so no date arithmetic that
# needs it (`ts::date`, `now() - interval '1 day'`). Timestamps are handled as
# int64 microseconds and compared with integer arithmetic instead, which avoids
# ICU entirely and is also faster.
#
# CI can skip the C++ build with DUCKDB_DOWNLOAD_LIB=1, which fetches a prebuilt
# library; that requires NOT enabling `bundled` and needs the dylib on the
# runtime search path.
duckdb = { workspace = true, optional = true, features = [
  "bundled",
  "parquet",
  # Arrow appender, for getting the entity frame in without per-row work.
  # Costs extra C++ template compilation on a clean build; see the input-mechanism
  # comparison in examples/duckdb_input.rs.
  "appender-arrow",
] }
tokio = { workspace = true, optional = true }

# The embedded online store, and the only thing the serving path needs. Twelve
# direct dependencies, no runtime and no C++, so a serving build stays cheap:
# that is the property that makes `feather serve` worth having in one process.
fjall = { workspace = true, optional = true }

[dev-dependencies]
# Only for the input-mechanism comparison, which needs to write an Arrow batch to
# Parquet to represent the temp-file route.
parquet.workspace = true
# A store test needs a directory it owns, and a database holds an exclusive lock while open,
# so each one gets its own temporary directory and drops it.
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = []
# Bundled DuckDB. First build compiles DuckDB from source and takes minutes.
offline = ["dep:duckdb"]
# The embedded LSM online store. Deliberately not implied by `offline`: the two
# are independent, and a serving-only build wants this one and nothing else.
fjall = ["dep:fjall"]
# The in-process map, the other in-process store. `offline` needs a store to
# write a refresh into, so it implies the cheapest one available.
memory = []
full = ["offline", "fjall", "memory"]

[[example]]
name = "duckdb_input"
# Needs the offline feature for the duckdb crate. Without this, a plain
# `cargo test --features fjall` fails to compile the example.
required-features = ["offline"]

[[example]]
name = "layout"
# Same reason as duckdb_input, and the measurement it takes is the one behind the
# layout guidance in docs/engine-and-format-decisions.md.
required-features = ["offline"]

[lib]
doctest = true
