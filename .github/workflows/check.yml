name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything here is seconds of work that used to queue behind the Rust build,
  # so a formatting mistake is reported without waiting for it. This job took 24s
  # with a warm mise cache and about three minutes with a cold one; the Rust job
  # takes five to eight.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags: a tag can be
      # repointed at new code without warning. The version is in the comment.
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # rustfmt is a component of the toolchain rather than a tool, so mise does
      # not treat it as missing, and a mise-action cache hit can leave it
      # uninstalled: the first run died on `cargo-fmt` not being installed for
      # the toolchain. Installing it here is explicit and does not depend on the
      # cache being cold.
      - name: rust components
        run: rustup component add rustfmt
      - name: fmt
        run: cargo fmt --all --check
      # ruff is not a project dependency: it is in neither the dev group in
      # pyproject.toml nor uv.lock. mise declares it and puts it on PATH, so
      # the job calls it directly, the same tool `mise run lint:python` runs,
      # and it no longer needs the extension built first.
      - name: ruff
        run: |
          ruff check python tests
          ruff format --check python tests
      # dprint owns every non-Rust, non-Python file type. Its plugin list lives
      # in dprint.json; this step just checks the tree.
      - name: data files
        run: dprint check

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # Line tables only. A bundled DuckDB build is the bulk of target/: the
      # static archive alone is 1.8GB, and most of that is debug info. Level 2
      # does not fit on a runner and tests never needed variables, but level 1
      # keeps file and line in panic backtraces.
      #
      # Scoped to this job rather than the workflow. rust-cache folds every
      # variable whose name starts with CARGO, CC, CFLAGS, CXX, CMAKE or RUST
      # into its cache key, so declaring it workflow-wide changes the key the
      # Python jobs compute and makes them miss the entry they saved themselves.
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner image carries tens of gigabytes of SDKs this job never
      # touches, and the DuckDB build filled what was left: the C++ archive step
      # died with "No space left on device" writing libduckdb.a. Deleting the
      # trees in parallel measured 82s against 127s for the sequential form on
      # the same commit.
      - name: free disk space
        run: |
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          df -h /
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # Bundled DuckDB compiles from source on a cold cache: measured on a
      # 2-core runner the rust job takes around 45 minutes, nearly all of it in
      # clippy and test.
      #
      # Only main saves. The entry is 2.3GB and the repository shares a 10GB
      # budget with the Python jobs' entries, so a pull request writing this key
      # would only push one that matters toward eviction. The key this job
      # computes is `v0-rust-rust-...`: rust-cache builds it from the prefix,
      # `GITHUB_JOB` and the runner platform, and `GITHUB_JOB` is this job's id,
      # `rust`. A `shared-key` input replaces that job-id part rather than adding
      # to it, so the `shared-key: rust` this branch first had produced the same
      # string by coincidence.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The other half of the cold build. This job's 2.3GB cargo entry holds the
      # 1.8GB libduckdb.a, and a miss means recompiling about 1,500 C++
      # translation units, which is the 45 minutes. ccache caches those objects
      # by content, so a cargo miss with a ccache hit is a relink.
      #
      # The rust job and both python matrix entries share the `dev` half of
      # that pair, because they compile the same C++ at the same profile and so
      # produce the same objects: ccache's hash covers the source and the flags,
      # not the crate that asked for them, so a Python job benefits from objects
      # the rust job compiled and the other way round. Three runners therefore
      # save the same dev key and only the first one's save lands, which is
      # actions/cache skipping a key that already exists. That is safe here and
      # only here: the entries that compete hold the same content, so which of
      # them wins changes nothing. The wheel job is the case where that is not
      # true, and it has a key of its own; see the argument there.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          profile: dev
      # clippy is a component of the toolchain rather than a tool, so mise does
      # not treat it as missing, and a mise-action cache hit can leave it
      # uninstalled: the first run died on `cargo-fmt` not being installed for
      # the toolchain. Installing it here is explicit and does not depend on the
      # cache being cold.
      - name: rust components
        run: rustup component add clippy
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            -- -D warnings
      # The suite includes the Valkey, RustFS, and Postgres integration
      # tests, which connect eagerly and have no skip guard: with nothing
      # listening they fail rather than skip. docker-compose.yml is reused
      # rather than bare containers so the tests meet the same maxmemory and
      # eviction constraints they are written against, rather than passing on
      # a roomier server than they target. RustFS comes up through the same
      # task a developer runs, because the bucket these tests read from is
      # created there: the image ignores RUSTFS_DEFAULT_BUCKETS and has no
      # bucket-create subcommand. Postgres needs no such step, because
      # `pg_isready` is a real healthcheck for `--wait` to wait on and the
      # test creates its own table through DuckDB. The first read of a remote
      # source installs an extension from the DuckDB extension repository,
      # `httpfs` for a URI and `postgres` for a table, so the job needs
      # network beyond these containers.
      - name: valkey, rustfs, and postgres
        run: |
          mise run valkey:up
          mise run s3:up
          mise run postgres:up
      - name: test
        run: cargo test --workspace --all-features
      - name: services down
        if: always()
        run: docker compose down -v
      # After the build, and only from main, for the reason the restore's key
      # gives: an entry written by a pull request is keyed on a compiler and a
      # DuckDB that the next run may not have, and the repository's cache budget
      # is 10GB across everything. Not `always()`, so a failed build does not
      # save a directory full of objects from a build that did not finish.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.key }}

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor and 3.14 is the newest supported.
        # Testing both is the only thing that keeps the floor honest, and
        # this machine has no 3.11 interpreter to check it locally.
        python: ["3.11", "3.14"]
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Disk cleanup here again, unlike before this branch and like the rust and
      # wheel jobs. It was removed because this job's own cargo entry is 326MB
      # and used to be the largest thing on the disk, after a run died with "No
      # space left on device" writing its own diagnostic log part way through the
      # restore while the two jobs still shared one cargo cache key. Both
      # reasons are now smaller than the one that replaces them: the ccache
      # entry restored below is up to 3GB, and `CCACHE_MAXSIZE` bounds what
      # ccache writes, not what actions/cache extracts, so the cap has not been
      # applied at the moment the archive is unpacked. The alternative was
      # restoring less, and there is nothing to cut: a partial ccache directory
      # is a partial hit rate, and this job is the one whose whole reason for
      # being here is the 1034s and 1592s of `uv sync` this is meant to remove.
      # The deletion is the same one the rust and wheel jobs run, measured at
      # 82s there against 127s for the sequential form.
      - name: free disk space
        run: |
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          df -h /
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: pin the interpreter
        run: uv venv --python ${{ matrix.python }}
      # The extension is built, because these tests exercise it: load_settings
      # reads feather.toml through the core, and FeatureStore runs the join
      # through it. That second one means crates/feather-py asks feather-core
      # for the offline engine, so this job pays the bundled DuckDB build it
      # used to skip, on both matrix interpreters. Measured with the archive
      # already in target/, a rebuild takes about four minutes; the rust job's
      # cold-cache figure is around 45. See the cold-build issue.
      #
      # This job keeps its own key, and its own entry is what caches that
      # archive: restoring it is what makes `uv sync` take about a minute rather
      # than rebuild. Sharing the rust job's entry does not work, and that was
      # measured rather than assumed: with that entry restored at a full match
      # the extension still recompiled bundled DuckDB, 1674s in `uv sync`
      # against 78s from this job's own entry. Pinning the editable build to the
      # rust job's dev profile did not change that, so the entry cannot serve a
      # build of the extension at all. The two matrix entries do share with each
      # other, which is free: they are one job id.
      #
      # This is also the only place the Python-to-Rust handoff is tested at
      # all: the rust job links the core directly and never loads the
      # extension.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The job this one hurts most when a cache misses, so it is the reason
      # ccache is here rather than only in the rust job: `uv sync` spent 1034s
      # and 1592s in the two matrix entries of the run recorded in the cold
      # build issue, all of it recompiling the C++ the manifest did not change.
      # `dev` for the reason the rust job's comment gives: this job builds the
      # same C++ at the same profile the rust job does, and the two matrix
      # entries below are the same job at two interpreters, so all three
      # compete for one key holding one set of objects and it does not matter
      # which of them writes it.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          profile: dev
      # After the restore, before anything compiles. ccache keeps its counters
      # inside its cache directory, and that directory is the whole of what the
      # action above archived and restored, so on a warm run the counters are
      # the previous run's. The regression the assertion below exists to catch
      # is `CC` failing to reach maturin's cargo: `uv sync` then recompiles all
      # 1,500 C++ units with no wrapper at all, ccache sees nothing, and its
      # totals are exactly the restored ones, which are non-zero. The
      # assertion would pass on precisely the build it was written to fail, and
      # a green run would be a lie about the one claim this branch makes.
      #
      # After the restore rather than before it, and that ordering is the point
      # rather than a detail: zeroing earlier is undone by the restore that
      # follows it. Objects are untouched, so the restored entries stay
      # hittable and a warm run still owes itself a hit.
      - name: start the counters from zero
        run: ccache --zero-stats
      - name: sync
        run: uv sync
      # The claim this branch exists for is that `uv sync` stops recompiling
      # unchanged C++, and nothing in this repository establishes that it does.
      # `CC` is set in `.cargo/config.toml`, and cargo finds that file by walking
      # up from the working directory, not from the manifest path. This job
      # reaches cargo through uv's PEP 517 build, so what decides the question is
      # the working directory maturin hands cargo, which is maturin's behaviour
      # and not something this tree can assert. So the build asserts it, after
      # the fact, from ccache's own counters.
      #
      # Both conditions are checked, and they are not the same condition.
      # `Cacheable calls` is non-zero on every run, cold included: it says the
      # extension build compiled through ccache at all, which is the part that
      # can silently not happen. A hit is only owed when the restore left
      # something to hit, so that is gated on the restore having been
      # non-empty. Without both, a cold run fails for a reason that is not a
      # defect and a warm run that recompiles everything passes on a build that
      # took twenty minutes. There is no `|| true`: a false claim that survives
      # a green build is the failure mode worth paying a red build for.
      #
      # The counters are this build's and not the restore's, because of the
      # `ccache --zero-stats` step above, which sits after the restore for
      # exactly that reason. Both numbers are read once, from the first matching
      # line, and a parse that does not produce a single integer is a hard
      # failure rather than a zero: `[ "$x" -eq 0 ]` on a multi-line value
      # returns 2, `set -e` does not fire inside an `if` condition, and the
      # guard that was supposed to catch a miss would pass instead.
      #
      # The cap is checked here too, and that is the third condition rather than
      # a comment. `ccache --show-stats` run from a shell step is a ccache
      # process cargo never started, so it reads no `CCACHE_MAXSIZE` and reports
      # ccache's own default. Measured on the pinned 4.14.1: an unset
      # `CCACHE_MAXSIZE` reports `Cache size (GiB): 0.0 / 5.0` and `3G` reports
      # `0.0 / 3.0`, so the `5.0` in this job's own log is that default and
      # says nothing either way about the cap that was in force while the
      # extension compiled. What was in force came from the same `[env]` table,
      # in the same environment block, as `CC`, and the cacheable calls above
      # are the proof that table reached maturin's cargo. The part that can be
      # checked from here is that the value in the file is one ccache accepts
      # and attributes to the environment; the rest is a comment above
      # `.cargo/config.toml` and, now, a `3.0` or a `5.0` nobody has to guess
      # about.
      - name: ccache reached the extension build
        run: |
          set -euo pipefail
          stats=$(ccache --show-stats)
          printf '%s\n' "$stats"
          restored="${{ steps.ccache.outputs.entries }}"
          # ccache 4.14 prints a ratio and not a count:
          # `Cacheable calls:    371 / 371 (100.0%)`, the numerator left
          # aligned in the label's column and the denominator right aligned in a
          # four wide field, so neither integer's width is predictable. The
          # number is therefore the leading integer before the `/`, and the
          # rest of the line is anchored rather than assumed: a bare integer, a
          # thousands separator, a unit suffix, a missing percentage, or
          # trailing text all leave the line unsubstituted and trip the case
          # below instead of yielding a truncated count that reads like a real
          # one. That is the same loudness the previous end-of-line anchor
          # bought, on the shape ccache actually prints; anchoring the count to
          # the end of the line rejected every line ccache can emit, so the
          # step failed on every run and asserted nothing.
          #
          # `0,/re/` rather than `/re/`, so the range ends at the first match and
          # exactly one line is printed. For `Hits:` that is a choice of which
          # counter rather than only a de-duplication: ccache prints a `Hits:`
          # line per call category, and two of them, the call-category one and
          # the local-storage one, share the `Cacheable calls:` line's
          # indentation, so indentation cannot tell them apart. The first is
          # the one this wants, because ccache prints it directly beneath
          # `Cacheable calls:` as that category's hit count. The other is
          # under `Local storage:` and counts cache entries served out of the
          # local directory, which is a different thing from a compiled result
          # being reused; taking it would test a counter this build barely
          # moves, which passes vacuously on exactly the run the assertion
          # exists to fail.
          cacheable=$(printf '%s\n' "$stats" \
            | sed -n '0,/^ *Cacheable calls:/{s/^ *Cacheable calls: *\([0-9][0-9]*\) *\/ *[0-9][0-9]* *( *[0-9][0-9.]*%)[[:space:]]*$/\1/p;}')
          case "$restored" in
            '' | *[!0-9]*)
              echo "ccache action reported a file count that is not an integer" >&2
              exit 1
              ;;
          esac
          case "$cacheable" in
            '' | *[!0-9]*)
              echo "no single Cacheable calls integer in ccache --show-stats" >&2
              printf '%s\n' "$stats" >&2
              exit 1
              ;;
          esac
          if [ "$cacheable" -eq 0 ]; then
            echo "uv sync compiled nothing through ccache: CC did not reach maturin's cargo" >&2
            exit 1
          fi
          hits=$(printf '%s\n' "$stats" \
            | sed -n '0,/^ *Hits:/{s/^ *Hits: *\([0-9][0-9]*\) *\/ *[0-9][0-9]* *( *[0-9][0-9.]*%)[[:space:]]*$/\1/p;}')
          case "$hits" in
            '' | *[!0-9]*)
              echo "no single Hits integer in ccache --show-stats" >&2
              printf '%s\n' "$stats" >&2
              exit 1
              ;;
          esac
          if [ "$restored" -ne 0 ] && [ "$hits" -eq 0 ]; then
            echo "restored $restored ccache files and this build hit none" >&2
            exit 1
          fi
          # The cap last, because it is the only one of the three that is a
          # property of this repository rather than of this run, so it should
          # not be what masks a real build failure. Read from
          # `.cargo/config.toml` rather than from the environment, deliberately:
          # a step that inherited the variable would be checking its own env
          # and proving nothing about the file cargo reads.
          cap=$(sed -n 's/^CCACHE_MAXSIZE *= *"\([^"]*\)"$/\1/p' .cargo/config.toml)
          case "$cap" in
            '' | *[!0-9A-Za-z.]*)
              echo "no CCACHE_MAXSIZE in .cargo/config.toml" >&2
              exit 1
              ;;
          esac
          # `ccache --show-config` names the source of every setting, so
          # `(environment) max_size` is ccache saying it took the value from
          # the environment, and a line reading `(default) max_size` is ccache
          # saying the opposite. Both the cap being rejected as a size string
          # and the cap silently not being in force land on the same empty
          # result here, which is the failure either way.
          applied=$(CCACHE_MAXSIZE="$cap" ccache --show-config \
            | sed -n 's/^(environment) max_size = \(.*\)$/\1/p')
          if [ -z "$applied" ]; then
            echo "ccache does not report an environment max_size for CCACHE_MAXSIZE=$cap" >&2
            CCACHE_MAXSIZE="$cap" ccache --show-config >&2 || true
            exit 1
          fi
          echo "ccache reports max_size = $applied for the configured CCACHE_MAXSIZE=$cap"
      # Gating, and not covered by pytest: tests/test_typing_contract.py pins
      # the typed definition API with assert_type and with
      # `# pyrefly: ignore[kind]`, which pyrefly rejects once the ignore stops
      # being needed. pytest only imports that file, so without this step those
      # guarantees go unenforced.
      - name: pyrefly
        run: uv run --no-sync pyrefly check
      # The suite includes three tests marked `integration`, which read and write
      # a real Valkey: the round trip, a rename that retires a view, and two
      # threads sharing one store. They connect eagerly and have no skip guard,
      # so with nothing listening they fail rather than skip. That is why the
      # rust job starts services for the same class of test. The constrained
      # container from docker-compose.yml is reused rather than a bare one, so
      # the tests meet the maxmemory and eviction limits they are written
      # against.
      - name: valkey
        run: mise run valkey:up
      - name: pytest
        run: uv run --no-sync pytest
      - name: services down
        if: always()
        run: docker compose down -v
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.key }}

  # The publishable artifact, and the README's first block run against it. The
  # wheel is what a user installs, so the source tree is not what this job
  # checks: it builds the wheel, asserts it is the one file it is supposed to be,
  # installs it into a venv that has no Rust toolchain and no build step, and
  # runs init, demo, refresh, and the join from there.
  wheel:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      # The runner image carries tens of gigabytes of SDKs this job never
      # touches, and it needs the room more than the rust job does: on the first
      # run of this job the disk filled during the build and `uv pip install` died
      # writing the extension out of the wheel. Same deletion, measured at 82s
      # against 127s for the sequential form in the rust job.
      - name: free disk space
        run: |
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          df -h /
      # A key of its own, not the python job's. That job's `uv sync` builds the
      # extension with the dev profile into target/debug and this one builds
      # target/release, so an entry restored from either is the wrong profile and
      # makes neither build quick; sharing a key across two profiles buys a
      # partial hit and a confusing one. The repository has a 10GB budget across
      # entries and a bundled DuckDB entry is gigabytes, so a third copy under
      # this job's own id would be the wrong trade either way. Saving is left to
      # main, for the reason the rust job gives.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wheel
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Release objects, and this job is the whole of the `release` half of the
      # two entries the workflow keeps. A ccache object is keyed on the
      # preprocessed source and the compiler flags, and target/release and
      # target/debug differ in the flags, so neither profile's objects are hits
      # for the other: one entry holding both would restore gigabytes this
      # build cannot use and evict the ones it can, so the profile is a key
      # segment and the restore prefix is scoped to it.
      #
      # Two entries and not three is the deliberate choice. A suffix per job
      # would be three, and three archives of a 3G directory against a 10GB
      # repository budget is the trade this workflow has already refused once,
      # for the cargo entries, on the record at this job's rust-cache step
      # above. Serialising the jobs instead was rejected for a worse reason:
      # `needs:` makes a failing rust job skip the python job entirely, so a
      # broken toolchain would take the interpreter coverage with it rather than
      # reporting both, and ordering alone does not make the save
      # deterministic anyway, because actions/cache keeps the *first* writer of
      # a key, which is the wrong job to be the one that publishes the release
      # objects.
      #
      # What makes this deterministic instead is that there is exactly one
      # writer of this key. The dev key is raced for by three runners, and
      # that is safe only because the entries that race hold the same objects;
      # here the release objects are produced by this job alone, so the entry
      # the key names is this job's directory by construction rather than by
      # whichever runner finished first.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          profile: release
      # maturin needs an interpreter to build against, and whether a bare `python`
      # is on a runner's PATH is not something to depend on. The version does not
      # decide the wheel's tag, because abi3 reads it off the pyo3 feature, so this
      # only makes the build's interpreter explicit.
      - name: an interpreter to build against
        run: uv python install 3.14 && uv venv --python 3.14 /tmp/build
      # Release, not debug, and deliberately so: this job builds the artifact a
      # publish job uploads, so it has to be the profile that artifact is built
      # from. A debug wheel would install and run the quickstart just as well and
      # would tell us nothing about the file that ships.
      #
      # `--strip` is the one flag here that is not incidental, because the wheel
      # is almost entirely DuckDB's symbol table: 255MB unstripped, 24MB
      # stripped, and PyPI refuses a file over 100MB. So a wheel that skipped
      # this would not upload, rather than merely being large. The next step
      # prints the size, so the number stays on the record instead of being
      # re-derived.
      - name: build the wheel
        run: maturin build --strip --interpreter /tmp/build/bin/python --out dist
      # The claim in pyproject.toml is one wheel for 3.11 through 3.14, which is
      # a property of the filename. A wheel that stopped being abi3 would install
      # on one interpreter and 404 on the rest, and nothing else in CI would say
      # so, because the python job tests the source tree.
      - name: one wheel, and it is the abi3 one
        run: |
          ls -lh dist
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "expected one wheel, got ${#wheels[@]}" >&2; exit 1; }
          case "${wheels[0]}" in
            *-cp311-abi3-*) ;;
            *) echo "${wheels[0]} is not a cp311-abi3 wheel" >&2; exit 1 ;;
          esac
      # A venv with the interpreter and the wheel, and nothing else. uv does not
      # build here because the argument is a wheel file, which is the property
      # under test: the user needs no compiler. Each step is its own shell, so the
      # wheel is named by the glob again rather than carried over.
      - name: a clean install
        run: |
          uv venv --python 3.14 /tmp/quickstart
          VIRTUAL_ENV=/tmp/quickstart uv pip install dist/*.whl polars
      - name: the README's first block
        run: |
          export PATH="/tmp/quickstart/bin:$PATH"
          mkdir -p /tmp/run
          cd /tmp/run
          feather init my_feature_store
          cd my_feature_store
          feather demo
          feather refresh
      # The README's join, on the data demo wrote. The row count and the
      # per-column null count are the two things a newcomer would look at: a
      # training set that lost rows, or one full of nulls, is not the same as the
      # one the README describes. `DataFrame.null_count()` is not a scalar in
      # polars 1.44, so the count is summed over the two feature columns rather
      # than compared on the frame.
      - name: the README's join, on the data demo wrote
        run: |
          cd /tmp/run/my_feature_store
          /tmp/quickstart/bin/python - <<'PY'
          import polars as pl
          from feather import FeatureStore
          from definitions.user_clicks import UserClicks

          store = FeatureStore("feather.toml")
          entity_df = pl.read_parquet("data/training_labels.parquet")

          training_data = pl.DataFrame(
              store.get_historical_features(
                  entity_df=entity_df,
                  features=[UserClicks.click_count, UserClicks.purchase_count],
              )
          )
          assert training_data.height == entity_df.height, "a label row was dropped"
          missing = sum(
              training_data[column].null_count()
              for column in ("click_count", "purchase_count")
          )
          assert missing == 0, f"{missing} nulls in the joined features"
          print(training_data.head())
          PY
      # After the build, and only from main, for the reason the restore's key
      # gives and the wheel job's own rust-cache entry above already gives: a
      # pull request writes a directory that is then thrown away with the
      # runner, and the repository's cache budget is 10GB across everything. Not
      # `always()`, so a failed build does not save objects from a build that
      # did not finish. Nothing else writes this key, so unlike the dev entry
      # this save is not a race with another job that happens to be running:
      # either this job ran to the end and the release objects are published, or
      # the entry does not exist and the next run is simply cold.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.key }}

  # TEMPORARY. This job exists to put a number on the cold build, and it is
  # deleted before the branch merges, so it is not part of the gate an agent is
  # waiting on and it is listed in AGENTS.md as scaffolding rather than as a
  # check. It restores no cargo cache and manages its own target directory,
  # because a cold number is the claim and a restored entry would quietly turn
  # the job into a warm one.
  #
  # Three builds, each into an empty target/, all of them the rust job's own two
  # commands:
  #
  #   1. ccache disabled. What a cache miss costs on the workflow as it stands.
  #      `CCACHE_DISABLE=1` leaves the compiler wrapper in place and stops it
  #      caching, so the compiler, the flags and the feature set are exactly
  #      what the rust job runs today, and the cost of the wrapper itself is not
  #      folded into the baseline.
  #   2. ccache enabled and empty. The same work, and the price of the entry
  #      being missing: this is what a fork's first run and an evicted cache pay
  #      after this change.
  #   3. ccache enabled and populated, target/ empty. A cargo cache miss with
  #      the objects still there, which is the case this change is for.
  #
  # `cargo test --no-run` rather than `cargo test`, because no service is
  # started here and the build is what the number is about. The suites' own
  # runtime is a few minutes and does not move with any of this.
  cold-measure:
    name: cold measure
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: free disk space
        run: |
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          df -h /
      - name: the three builds
        run: |
          set -euo pipefail

          clippy_and_build() {
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features --no-run
          }

          # $1 labels the phase, $2 is `disabled` for the baseline. The size and
          # the counters after each phase are what set CCACHE_MAXSIZE and show
          # whether the third build really hit.
          phase() {
            local label="$1" start
            if [ "${2:-}" = disabled ]; then
              export CCACHE_DISABLE=1
            else
              unset CCACHE_DISABLE
            fi
            rm -rf target
            start=$SECONDS
            clippy_and_build
            echo "RESULT $label: $(( SECONDS - start ))s"
            du -sh ~/.cache/ccache
            ccache --show-stats | grep -Ei 'hit|miss|direct|cacheable' || true
            df -h /
          }

          ccache --version
          phase "cold, ccache disabled" disabled
          phase "cold, ccache empty"
          phase "cold target, ccache warm"
