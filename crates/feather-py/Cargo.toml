[package]
name = "feather-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for Feather"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow.workspace = true
# `offline` is a default feature: `FeatureStore` runs the point-in-time join, so
# the engine has to be in the wheel. That means DuckDB in every build of the
# extension, which is a download and a link this crate used to avoid. It also means
# the Python CI job can no longer skip the engine.
feather-core = { path = "../feather-core" }
# The serving surface. A `serve`-only build links this and not `offline`, so a
# deployment that only serves carries no DuckDB at all. That is the point of
# keeping the transport in its own crate.
feather-serve = { path = "../feather-serve", optional = true }
# For `feather demo`, which writes the two Parquet files the generated project
# reads. Same version as arrow, for the same reason: two Arrow majors in one
# process do not share types.
parquet.workspace = true
# No `extension-module` feature here on purpose. maturin sets
# PYO3_BUILD_EXTENSION_MODULE for PyO3 >= 0.27, and enabling the feature
# statically would stop `cargo test` from linking.
# abi3-py311 rather than py312: the Python floor is 3.11 (StrEnum), so one wheel
# covers 3.11 through 3.14. Nothing here needs a newer limited API.
pyo3 = { workspace = true, features = ["abi3-py311"] }
pyo3-arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The online store's I/O is asynchronous, so the binding owns a runtime and blocks on it from
# the Python thread. Optional because every use sits behind `offline` or `serve`: without one
# of those there is no store or server for a runtime to serve, and an unconditional dependency
# would make a build carry one it cannot use.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }

[features]
# `serve` and `fjall` are default because both are load-bearing for a project that
# actually serves: without `serve` no wheel has `_core.serve` and `FeatureStore.serve()`
# is a RuntimeError, and without `fjall` nothing can write the database `serve()` opens,
# so `feather refresh` would populate a map that dies with the process and every read
# would come back null. Neither implies `offline`, and neither drags in DuckDB: a
# `serve`-only build links `feather-serve` and nothing else.
default = ["offline", "fjall", "serve"]
# Forwarded so that `cargo test --workspace --all-features` still builds and
# tests the engines, and so a build can drop DuckDB with --no-default-features.
offline = ["feather-core/offline", "dep:tokio"]
# The embedded store, which the materialization path needs so a refresh writes the
# database `serve()` opens.
fjall = ["feather-core/fjall"]
# Serving over Arrow Flight. Does not imply `offline`: a project that only reads
# online features never runs a point-in-time join, so it should not pay for the engine.
serve = ["dep:feather-serve", "dep:tokio"]
