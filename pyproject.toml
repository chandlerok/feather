[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "feather-py"
version = "0.0.1"
description = "An opinionated feature store with a Rust core and a native Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Chandler King" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  # The support range is a claim a classifier makes, so it is spelled out rather
  # than left to requires-python. 3.14 is named here because the floor is what
  # ruff's target-version can express and the ceiling is what this list is for.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.9"]

[project.scripts]
# One command, the one the README's first block runs. It is pure Python and
# imports the compiled extension only for the calls that need it, so `feather
# --help` works on an install whose extension failed to load.
feather = "feather.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "polars>=1.0",
  "pyrefly>=1.3",
]

[tool.maturin]
# The Rust crates are a Cargo workspace, so point maturin at the member that
# builds the extension.
manifest-path = "crates/feather-py/Cargo.toml"
module-name = "feather._core"
python-source = "python"
python-packages = ["feather"]
# One wheel for 3.11 through 3.14. pyo3 carries `abi3-py311`, and maturin reads
# that feature to name the artifact `cp311-abi3`, so a 3.14 install resolves the
# same file rather than a per-minor one. Nothing in the bindings needs a symbol
# outside the limited API, which is what makes that true; the wheel CI job
# asserts the tag so a change to the pyo3 features cannot quietly make it false.
# The wheel ships bundled DuckDB, so it is large. That is the price of the user
# compiling nothing, and the alternative is a per-interpreter build at install
# time.
#
# Deliberately no `features = ["pyo3/extension-module"]`. For PyO3 >= 0.27 maturin
# sets PYO3_BUILD_EXTENSION_MODULE itself, and enabling the feature statically
# breaks `cargo test` linking.

[tool.uv]
package = true
# uv rebuilds the extension only when a cache key changes, so the Rust sources
# must be listed or edits to them are silently ignored. This key list replaces
# uv's defaults, so pyproject.toml stays in it.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package lives under python/, so tests import the source tree rather than an
# installed copy. The extension is still required: tests/test_online.py imports
# MaterializeReport and ViewRefresh, which the compiled module provides.
pythonpath = ["python"]
markers = [
  "integration: requires a running Valkey container",
  "load: measures throughput or latency, not run by default",
]
addopts = "-q"

[tool.ruff]
# The floor of the support range, set explicitly rather than inferred, so it is
# visible in review. 3.11 is the real floor: `StrEnum` in feather/types.py is the
# only version-sensitive thing we use, and it is 3.11+. Not py314, because that
# target emits an "under development" warning in ruff 0.12.x.
target-version = "py311"
line-length = 100
src = ["python", "tests"]
extend-exclude = ["target", "dist", "build"]

[tool.ruff.lint]
# Explicit select rather than extend-select, so the rule set cannot drift on
# upgrade. D and ANN are included from the start because the library's public
# surface should be documented and annotated; adding them later is noisier.
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "PERF", # perflint
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific
  "TC", # flake8-type-checking
  "D", # pydocstyle
  "ANN", # flake8-annotations
]
ignore = [
  "D203", # conflicts with D211
  "D213", # conflicts with D212
  "E501", # line length is the formatter's job
  "ANN401", # Any is sometimes the honest annotation
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations when the class is created, so a type used in a
# model field has to be importable at runtime even though `from __future__ import
# annotations` makes the annotation text lazy. Without this, TC001 asks for the import
# to move into a TYPE_CHECKING block, and the model then fails at import with "is not
# fully defined; you should define NonEmptyStr".
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true

# Pyrefly is the type checker, and the only one: no mypy, no pyright, no ty. It
# reads this table natively, and its version is pinned in uv.lock.
#
# The Python package lives under python/ and the extension is compiled, so
# Pyrefly has to be told where the source root is. Without search-path it reports
# every first-party import as unresolved.
#
# Note for anyone seeing "Cannot find module" from a tooling wrapper: Pyrefly
# takes the project root from the configuration file it finds by walking up from
# the files being checked, and resolves imports relative to that. Invoked from
# outside this directory on an absolute path, it never reads this table, so it
# never learns about search-path or the interpreter's site-packages.
[tool.pyrefly]
project-includes = ["python", "tests"]
search-path = ["python"]
# Pin the interpreter. Left unset, pyrefly queries `python3` and `python` on PATH
# to find site-packages, so a wrapper whose PATH lacks the venv resolves against a
# system Python and reports every installed dependency as an unresolved import
# while the same check passes under `uv run`.
python-interpreter-path = ".venv/bin/python"
python-version = "3.11"
# Libraries ship everywhere; do not let the build host narrow the types.
python-platform = "all"

[tool.pyrefly.errors]
# An ignore that is no longer needed is a claim about the code that stopped being
# true, so it is an error rather than dead noise. tests/test_typing_contract.py
# relies on this to pin checks that must fire.
unused-ignore = true
