---
# Real Valkey with production-shaped limits, so tests and load runs meet the
# constraints they will meet in a cluster rather than on an idle laptop.
#
# maxmemory is deliberately below the container limit: the point is to exercise
# eviction and the "key is gone" path, not to have a comfortable buffer.
services:
  valkey:
    image: valkey/valkey:9-alpine
    command:
      - valkey-server
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
      - --io-threads
      - "2"
      - --tcp-keepalive
      - "60"
    ports:
      - "127.0.0.1:6379:6379"
    cpus: 2
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # An S3-compatible object store, so the remote-read path meets a real
  # server rather than a mock. Single-node single-disk, which is what RustFS
  # recommends for local testing. No healthcheck: the image's tooling is not
  # guaranteed, and the test waits for readiness itself rather than the
  # compose file guessing at a health endpoint.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Loopback only, and not the documented defaults: the RustFS entrypoint
      # warns that the public default pair is unsafe.
      RUSTFS_ACCESS_KEY: feathertest
      RUSTFS_SECRET_KEY: feathertest
      # So a test can write without creating a bucket first. A server that
      # predates this variable ignores it, which is why the test creates the
      # bucket when it is missing.
      RUSTFS_DEFAULT_BUCKETS: feather-test
    ports:
      - "127.0.0.1:9000:9000"
    cpus: 2
    mem_limit: 512m
    volumes:
      - rustfs-data:/data

volumes:
  rustfs-data:
