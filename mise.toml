[tools]
# rustfmt and clippy are components of the toolchain, not separate tools. mise
# delegates to rustup, whose default profile includes both, but a cache hit can
# skip the install entirely and leave them missing. The explicit component step
# in CI is the one that actually holds; this declaration is for a fresh machine.
rust = { version = "latest", components = ["rustfmt", "clippy"] }
uv = "latest"
# Pinned: hk.pkl amends a versioned schema URL, so a floating hk would drift away
# from the schema it loads.
hk = "1.56.1"
ruff = "latest"
maturin = "latest"
# Formats every non-Rust, non-Python file type: JSON, TOML, YAML, Markdown,
# Dockerfile. cargo owns Rust, ruff owns Python.
dprint = "latest"
"cargo:bacon" = "latest"

[tasks.setup]
description = "Install Python deps and the git hook"
run = ["uv sync --all-groups", "hk install --mise"]

# ---------------------------------------------------------------- formatting

[tasks.format]
description = "Format Rust, Python, and data files"
run = ["cargo fmt --all", "ruff format python tests", "dprint fmt"]

[tasks."format:check"]
description = "Check formatting without writing"
run = ["cargo fmt --all --check", "ruff format --check python tests", "dprint check"]

# ------------------------------------------------------------------- linting

[tasks.lint]
description = "Lint everything that is fast enough for a commit hook"
depends = ["lint:rust", "lint:python", "lint:types"]

[tasks."lint:rust"]
description = "Clippy over the whole workspace, including feature-gated code"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:python"]
run = "ruff check python tests"

# Gating. The typed definition API is the reason a feature reference is checkable
# at all, and tests/test_typing_contract.py pins those guarantees with assert_type
# and with `# pyrefly: ignore[kind]`, which pyrefly rejects once the ignore stops
# being needed. pytest only imports that file, so without this the guarantees are
# unenforced. The version is pinned in uv.lock.
[tasks."lint:types"]
run = "uv run --no-sync pyrefly check"

# ------------------------------------------------------------------- testing

[tasks.test]
description = "Unit tests. No external services required."
run = [
  "cargo test --workspace --all-features",
  "uv run pytest -m 'not integration and not load'",
]

[tasks."test:integration"]
description = "Integration tests against a real Valkey container"
depends = ["valkey:up"]
run = "uv run pytest -m integration"

[tasks.check]
description = "Everything a CI run would do"
depends = ["format:check", "lint", "test"]

# ---------------------------------------------------------------- containers

[tasks."valkey:up"]
description = "Start Valkey with production-shaped resource limits"
run = "docker compose up -d --wait valkey"

[tasks."valkey:down"]
description = "Stop Valkey and delete its volume"
run = "docker compose down -v"

[tasks."valkey:logs"]
run = "docker compose logs -f valkey"

[tasks."valkey:cli"]
run = "docker compose exec valkey valkey-cli"

# ------------------------------------------------------------------ load/bench

[tasks.bench]
description = "Rust micro-benchmarks"
run = "cargo bench --workspace --all-features"

[tasks."bench:valkey"]
description = "Raw Valkey ceiling, for comparison against our read path"
depends = ["valkey:up"]
run = "docker compose exec valkey valkey-benchmark -h 127.0.0.1 -p 6379 -n 200000 -c 50 -t get,set -q"

[tasks."bench:load"]
description = "Load test the online read path against real Valkey"
depends = ["valkey:up"]
# Only the valkey feature: the load test measures the online path, and pulling in
# bundled DuckDB would add minutes to the build for nothing.
run = "cargo run --release -p feather-core --features valkey --example loadtest"

# --------------------------------------------------------------------- watch

[tasks.watch]
description = "Background Rust check loop"
run = "bacon"
