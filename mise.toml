[tools]
# rustfmt and clippy are components of the toolchain, not separate tools. mise
# delegates to rustup, whose default profile includes both, but a cache hit can
# skip the install entirely and leave them missing. The explicit component step
# in CI is the one that actually holds; this declaration is for a fresh machine.
# Pinned, not floating. rust-cache puts the resolved rustc version in its cache
# key, so `latest` invalidates the whole 2.3GB cargo entry the day a new release
# lands and quietly turns the next run into a from-source DuckDB build. The
# version is the one CI already resolved; bumping it is a deliberate cache reset.
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }
# Not a build tool cargo knows about: `.cargo/config.toml` points CC and CXX at
# it, so a build with ccache is fast and a build without it fails outright.
# Declared here so `mise install` covers it, which is also how CI gets it: the
# runner image does not carry ccache, and apt would be the alternative.
#
# Pinned, for the reason rust is pinned just above and with more force: if the
# ccache version were floating, it would not even be in the Actions cache key,
# which is what makes the rest of the argument bite. ccache's on-disk format is
# its own version, so a directory written by one major is not readable by the
# next. A floating `latest` that installed a new ccache would compute the same
# `ccache-Linux-...` key, restore the old directory, be refused every entry in
# it, and then skip the save because actions/cache does not overwrite an exact
# key. The cache goes inert, silently, and the job gets slower while green.
# 4.14.1 is the release GitHub reports as latest (ccache/ccache, checked while
# fixing this); bumping it is a deliberate cache reset. The key reads the
# version that is installed rather than the one written here, so the two cannot
# drift apart silently.
ccache = "4.14.1"
uv = "latest"
# Pinned: hk.pkl amends a versioned schema URL, so a floating hk would drift away
# from the schema it loads.
hk = "1.56.1"
# Pinned, for a different reason than rust above. No cache is keyed on ruff:
# rust-cache keys on the resolved rustc version, there is no mise.lock, and the
# `lint` job's only other cache is mise's own install cache, so a floating ruff
# costs nothing to re-resolve. What it costs is disagreement. `ruff format
# --check` is the CI gate, and `mise run format` and `hk fix` both rewrite files
# through hk.pkl's Builtins.ruff_format, so a formatter release lands as an
# unrelated reformat inside whatever PR happens to be open. That is the hk class
# of reason, not the rust one. The version is the one resolved here; bumping it is a one-line change, and
# pyproject.toml's ruff configuration was written against the 0.12.x series.
ruff = "0.16.9"
maturin = "latest"
# Formats every non-Rust, non-Python file type: JSON, TOML, YAML, Markdown,
# Dockerfile. cargo owns Rust, ruff owns Python.
dprint = "latest"
"cargo:bacon" = "latest"

[tasks.setup]
description = "Install Python deps and the git hook"
run = ["uv sync --all-groups", "hk install --mise"]

[tasks."build:wheel"]
description = "Build the wheel into dist/, the artifact a user installs"
# --strip, because the wheel is almost entirely DuckDB's symbol table: 255MB
# unstripped, 24MB stripped, and PyPI refuses a file over 100MB. CI builds the
# artifact the same way, so a local build without it is not the file that ships.
run = ["maturin build --strip --out dist"]

# ---------------------------------------------------------------- formatting

[tasks.format]
description = "Format Rust, Python, and data files"
run = ["cargo fmt --all", "ruff format python tests", "dprint fmt"]

[tasks."format:check"]
description = "Check formatting without writing"
run = ["cargo fmt --all --check", "ruff format --check python tests", "dprint check"]

# ------------------------------------------------------------------- linting

[tasks.lint]
description = "Lint everything that is fast enough for a commit hook"
depends = ["lint:rust", "lint:python", "lint:types"]

[tasks."lint:rust"]
description = "Clippy over the whole workspace, including feature-gated code"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:python"]
run = "ruff check python tests"

# Gating. The typed definition API is the reason a feature reference is checkable
# at all, and tests/test_typing_contract.py pins those guarantees with assert_type
# and with `# pyrefly: ignore[kind]`, which pyrefly rejects once the ignore stops
# being needed. pytest only imports that file, so without this the guarantees are
# unenforced. The version is pinned in uv.lock.
[tasks."lint:types"]
run = "uv run --no-sync pyrefly check"

# ------------------------------------------------------------------- testing

[tasks.test]
description = "Cargo tests and the Python unit tests; the Rust integration tests need the services CI starts."
run = [
  "cargo test --workspace --all-features",
  "uv run pytest -m 'not integration and not load'",
]

[tasks."test:integration"]
description = "Integration tests against a real Valkey container"
depends = ["valkey:up"]
run = "uv run pytest -m integration"

[tasks.check]
description = "Everything a CI run would do"
depends = ["format:check", "lint", "test"]

# ---------------------------------------------------------------- containers

[tasks."valkey:up"]
description = "Start Valkey with production-shaped resource limits"
run = "docker compose up -d --wait valkey"

[tasks."valkey:down"]
description = "Stop Valkey and delete its volume"
run = "docker compose down -v"

[tasks."valkey:logs"]
run = "docker compose logs -f valkey"

[tasks."valkey:cli"]
run = "docker compose exec valkey valkey-cli"

# The bucket cannot come from the server. RUSTFS_DEFAULT_BUCKETS is ignored by the image
# (the variable reaches the container and no bucket appears), rustfs 1.0.0 has no
# bucket-create subcommand, and writing an object into a missing bucket is refused rather
# than creating one, so docker-compose.yml declares no bucket at all. curl signs this PUT
# itself (`--aws-sigv4`), which is why it needs no S3 client. The retry doubles as the
# readiness wait, because `--wait` returns when the container is running rather than when
# the server accepts connections. The endpoint, credentials, and bucket name mirror
# docker-compose.yml, which is where the server gets them.
[tasks."s3:up"]
description = "Start RustFS and create the bucket the S3 integration test reads"
run = '''
docker compose up -d --wait rustfs

for _ in $(seq 30); do
  curl -fsS -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
    --user "feathertest:feathertest" "http://127.0.0.1:9000/feather-test" && exit 0
  # Retry a refused connection; stop on anything else, which is a real error rather
  # than a server that has not started listening yet.
  code=$?
  [ "$code" = 7 ] || { echo "curl --aws-sigv4 exited $code" >&2; exit "$code"; }
  sleep 1
done

echo "RustFS at 127.0.0.1:9000 did not accept a connection within 30s" >&2
exit 1
'''

# This compose version rejects a service argument to `down`, so, as with `valkey:down`,
# stopping one container stops the project and deletes both volumes.
[tasks."s3:down"]
description = "Stop RustFS and Valkey and delete their volumes"
run = "docker compose down -v"

[tasks."s3:logs"]
run = "docker compose logs -f rustfs"

# Unlike RustFS, this image has a real readiness probe, so `--wait` returns when the
# server accepts connections rather than when the container starts, and there is nothing
# to seed: the integration test creates its own table through DuckDB.
[tasks."postgres:up"]
description = "Start Postgres for the Postgres integration test"
run = "docker compose up -d --wait postgres"

[tasks."postgres:down"]
description = "Stop Postgres and delete its volume"
run = "docker compose down -v"

[tasks."postgres:logs"]
run = "docker compose logs -f postgres"

# ------------------------------------------------------------------ load/bench

[tasks.bench]
description = "Rust micro-benchmarks"
run = "cargo bench --workspace --all-features"

[tasks."bench:valkey"]
description = "Raw Valkey ceiling, for comparison against our read path"
depends = ["valkey:up"]
run = "docker compose exec valkey valkey-benchmark -h 127.0.0.1 -p 6379 -n 200000 -c 50 -t get,set -q"

[tasks."bench:load"]
description = "Load test the online read path against real Valkey"
depends = ["valkey:up"]
# Only the valkey feature: the load test measures the online path, and pulling in
# bundled DuckDB would add minutes to the build for nothing.
run = "cargo run --release -p feather-core --features valkey --example loadtest"

# --------------------------------------------------------------------- watch

[tasks.watch]
description = "Background Rust check loop"
run = "bacon"
