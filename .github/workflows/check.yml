name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything here is seconds of work that used to queue behind the Rust build,
  # so a formatting mistake is reported without waiting for it. This job took 24s
  # with a warm mise cache and about three minutes with a cold one; the Rust job
  # takes five to eight.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags: a tag can be
      # repointed at new code without warning. The version is in the comment.
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # rustfmt is a component of the toolchain rather than a tool, so mise does
      # not treat it as missing, and a mise-action cache hit can leave it
      # uninstalled: the first run died on `cargo-fmt` not being installed for
      # the toolchain. Installing it here is explicit and does not depend on the
      # cache being cold.
      - name: rust components
        run: rustup component add rustfmt
      - name: fmt
        run: cargo fmt --all --check
      # ruff is not a project dependency: it is in neither the dev group in
      # pyproject.toml nor uv.lock. mise declares it and puts it on PATH, so
      # the job calls it directly, the same tool `mise run lint:python` runs,
      # and it no longer needs the extension built first.
      - name: ruff
        run: |
          ruff check python tests
          ruff format --check python tests
      # dprint owns every non-Rust, non-Python file type. Its plugin list lives
      # in dprint.json; this step just checks the tree.
      - name: data files
        run: dprint check

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # Line tables only, not full debug info: tests never needed variables, and
      # level 1 still keeps file and line in panic backtraces. The bundled DuckDB
      # archive that made the cached target/ large is gone, so a higher level
      # should now fit. No run has saved an entry under it, so the first run on
      # main is what measures that, and changing the level changes the cache key
      # below.
      #
      # Scoped to this job rather than the workflow. rust-cache folds every
      # variable whose name starts with CARGO, CC, CFLAGS, CXX, CMAKE or RUST
      # into its cache key, so declaring it workflow-wide changes the key the
      # Python jobs compute and makes them miss the entry they saved themselves.
      CARGO_PROFILE_DEV_DEBUG: "1"
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No disk cleanup here. It existed because the bundled DuckDB build filled
      # the runner's free space; that build is gone, so this job no longer
      # deletes 5 SDK trees to make room.
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # Compiling bundled DuckDB used to be the bulk of this job's cold-cache
      # time, measured at around 45 minutes on a 2-core runner. The prebuilt
      # library removes that compile, so this entry is now mostly the Rust build.
      #
      # Only main saves. The repository shares a 10GB budget with the Python jobs'
      # entries, so a pull request writing this key would only push one that
      # matters toward eviction. The key this job computes is `v0-rust-rust-...`:
      # rust-cache builds it from the prefix, `GITHUB_JOB` and the runner
      # platform, and `GITHUB_JOB` is this job's id, `rust`. That id is also why
      # the wheel job's entry is its own; a `shared-key` input replaces the
      # job-id part rather than adding to it, and the wheel job passes one equal
      # to its id.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache restores target/**, which includes libduckdb-sys's build-script
      # output, so a restored target/ carries a fresh fingerprint for that script.
      # It does not carry the libduckdb.so that output points at: the recorded
      # -L target/duckdb-download/.../1.5.5 is present and the directory is empty,
      # and the link fails with "unable to find library -lduckdb". Deleting the
      # build-script output makes cargo re-run the script, which re-downloads the
      # library (about 40MB, seconds) when it is missing and does nothing when it
      # is not. This is deliberate rather than a separate cache on the library:
      # a cache keyed on that path misses for exactly the same reason, so it
      # cannot bootstrap a first run.
      #
      # The same step and the same reasoning are in the python and wheel jobs,
      # because each of them restores its own target/.
      - name: the DuckDB library is not in the target cache
        run: rm -rf target/*/build/libduckdb-sys-*
      # clippy is a component of the toolchain rather than a tool, so mise does
      # not treat it as missing, and a mise-action cache hit can leave it
      # uninstalled: the first run died on `cargo-fmt` not being installed for
      # the toolchain. Installing it here is explicit and does not depend on the
      # cache being cold.
      - name: rust components
        run: rustup component add clippy
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            -- -D warnings
      # Nothing else in this workflow compiles the build with no engine in it:
      # clippy above and the test suite below both pass `--all-features`, where
      # every `#[cfg(feature = "offline")]` is true, so the ungated path never
      # reaches a compiler. `feather-core`'s `default = []` makes
      # `--no-default-features` the build a Rust consumer of the crate gets, and
      # it is the one `feather-py` gets once `offline` is dropped: no DuckDB, and
      # the online read path still there. Neither links DuckDB, which is why
      # these are `check` and not `test`.
      - name: check the ungated build
        run: |
          cargo check -p feather-core --no-default-features
          cargo check -p feather-py --no-default-features
      # The suite includes the RustFS and Postgres integration
      # tests, which connect eagerly and have no skip guard: with nothing
      # listening they fail rather than skip. docker-compose.yml is reused
      # rather than bare containers so the tests meet the same
      # constraints they are written against. RustFS comes up through the same
      # task a developer runs, because the bucket these tests read from is
      # created there: the image ignores RUSTFS_DEFAULT_BUCKETS and has no
      # bucket-create subcommand. Postgres needs no such step, because
      # `pg_isready` is a real healthcheck for `--wait` to wait on and the
      # test creates its own table through DuckDB. The first read of a remote
      # source installs an extension from the DuckDB extension repository,
      # `httpfs` for a URI and `postgres` for a table, so the job needs
      # network beyond these containers.
      - name: rustfs and postgres
        run: |
          mise run s3:up
          mise run postgres:up
      - name: test
        run: cargo test --workspace --all-features
      - name: services down
        if: always()
        run: docker compose down -v

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor and 3.14 is the newest supported.
        # Testing both is the only thing that keeps the floor honest, and
        # this machine has no 3.11 interpreter to check it locally.
        python: ["3.11", "3.14"]
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No disk cleanup here. It was added for the 2267MB entry this job
      # restored while the two jobs shared one cargo cache key, and that is what
      # filled the disk: the runner died with "No space left on device" writing
      # its own diagnostic log, part way through the restore, which is also why
      # the job's log was missing rather than showing an error. The keys are
      # separate again, which is a change of its own and not a consequence of
      # the DuckDB one, and this job's entry was 326MB under the bundled build.
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: pin the interpreter
        run: uv venv --python ${{ matrix.python }}
      # The extension is built, because these tests exercise it: load_settings
      # reads feather.toml through the core, and FeatureStore runs the join
      # through it. That second one means crates/feather-py asks feather-core for
      # the offline engine. It is also the only place the Python-to-Rust handoff
      # is tested at all: the rust job links the core directly and never loads the
      # extension.
      #
      # This job keeps its own cache key. The measurement behind that was about
      # the bundled DuckDB archive, which no longer exists, so sharing the rust
      # job's entry may now be fine. Untested, and a CI question rather than a
      # guess. The two matrix entries do share with each other, which is free:
      # they are one job id.
      #
      # What still argues for a key of its own is that the two jobs do not build
      # the same thing. `uv sync` resolves the editable extension against
      # target/release; the rust job runs clippy and `cargo test`, which produce
      # neither the feather-py cdylib nor the build graph `uv sync` resolves, so
      # a full key match cost 1674s in `uv sync` against 78s from the job's own
      # entry. Whether the prebuilt library reopened that gap is the untested
      # question above.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The DuckDB library is not in this job's target cache either. The
      # reasoning is in the rust job.
      - name: the DuckDB library is not in the target cache
        run: rm -rf target/*/build/libduckdb-sys-*
      - name: sync
        run: uv sync
      # Gating, and not covered by pytest: tests/test_typing_contract.py pins
      # the typed definition API with assert_type and with
      # `# pyrefly: ignore[kind]`, which pyrefly rejects once the ignore stops
      # being needed. pytest only imports that file, so without this step those
      # guarantees go unenforced.
      - name: pyrefly
        run: uv run --no-sync pyrefly check
      # No container is started for this job. The three online-store tests that
      # used to need a real Valkey now run against the embedded store in a
      # per-project temp directory, so the round trip, a rename that retires a
      # view, and two threads sharing one store are all ordinary unit tests here
      # rather than integration ones.
      - name: pytest
        run: uv run --no-sync pytest
      - name: services down
        if: always()
        run: docker compose down -v

  # The publishable artifact, and the README's first block run against it. The
  # wheel is what a user installs, so the source tree is not what this job
  # checks: it builds the wheel, asserts it is the one file it is supposed to be,
  # installs it into a venv that has no Rust toolchain and no build step, and
  # runs init, demo, refresh, and the join from there.
  wheel:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      # renovate: datasource=github-tags depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # renovate: datasource=github-tags depName=jdx/mise-action
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # astral-sh/setup-uv, pinned at v10.2.0
      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      # No disk cleanup here. It existed because this job needs more room than
      # the rust job: the peak is a `maturin build` of the whole workspace into
      # target/maturin and then `uv pip install dist/*.whl polars`, and on its
      # first run the disk filled during the build, so the install died writing
      # the extension out of the wheel. That was the DuckDB build filling the
      # room, and it is gone, so on ubuntu the removal is measured rather than
      # argued: this job is green on the head that removed the step.
      # A key of its own, not the python job's. The two jobs build the same
      # extension under different profiles and in different target directories:
      # the python job's `uv sync` builds release into target/release, and
      # maturin here builds dev into target/maturin. An entry restored from
      # either is the wrong profile in the wrong directory, so sharing a key
      # buys a partial hit that makes neither build quick. Saving is left to
      # main, for the reason the rust job gives.
      # renovate: datasource=github-tags depName=Swatinem/rust-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wheel
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The DuckDB library is not in this job's target cache either. The
      # reasoning is in the rust job.
      - name: the DuckDB library is not in the target cache
        run: rm -rf target/*/build/libduckdb-sys-*
      # maturin needs an interpreter to build against, and whether a bare `python`
      # is on a runner's PATH is not something to depend on. The version does not
      # decide the wheel's tag, because abi3 reads it off the pyo3 feature, so this
      # only makes the build's interpreter explicit.
      - name: an interpreter to build against
        run: uv python install 3.14 && uv venv --python 3.14 /tmp/build
      # The dev profile, not release, and that is a gap rather than the intent:
      # the command below carries no --release, so the wheel this job checks is
      # built unoptimized into target/maturin, while the python job's editable
      # build is target/release. publish.yml passes --release because the file
      # it uploads is the one a user installs. A release build here would measure
      # a second, unmeasured build of the extension on a 2-core runner, so the
      # job checks the profile that is cheap and leaves the gap written down.
      #
      # `--strip` is the one flag here that is not incidental, because the wheel
      # is almost entirely DuckDB's symbol table and PyPI refuses a file over
      # 100MB, so a wheel that skipped this would not upload. The 255MB
      # unstripped and 24MB stripped figures belong to the bundled static
      # archive; the shared library this wheel links is a different size, and
      # this step's first run measured the dev profile's at 32MB.
      - name: build the wheel
        run: maturin build --strip --interpreter /tmp/build/bin/python --out dist
      # The claim in pyproject.toml is one wheel for 3.11 through 3.14, which is
      # a property of the filename. A wheel that stopped being abi3 would install
      # on one interpreter and 404 on the rest, and nothing else in CI would say
      # so, because the python job tests the source tree.
      - name: one wheel, and it is the abi3 one
        run: |
          ls -lh dist
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "expected one wheel, got ${#wheels[@]}" >&2; exit 1; }
          case "${wheels[0]}" in
            *-cp311-abi3-*) ;;
            *) echo "${wheels[0]} is not a cp311-abi3 wheel" >&2; exit 1 ;;
          esac
      # A venv with the interpreter and the wheel, and nothing else. uv does not
      # build here because the argument is a wheel file, which is the property
      # under test: the user needs no compiler. Each step is its own shell, so the
      # wheel is named by the glob again rather than carried over.
      - name: a clean install
        run: |
          uv venv --python 3.14 /tmp/quickstart
          VIRTUAL_ENV=/tmp/quickstart uv pip install dist/*.whl polars
      - name: the README's first block
        run: |
          export PATH="/tmp/quickstart/bin:$PATH"
          mkdir -p /tmp/run
          cd /tmp/run
          feather init my_feature_store
          cd my_feature_store
          feather demo
          feather refresh
      # The README's join, on the data demo wrote. The row count and the
      # per-column null count are the two things a newcomer would look at: a
      # training set that lost rows, or one full of nulls, is not the same as the
      # one the README describes. `DataFrame.null_count()` is not a scalar in
      # polars 1.44, so the count is summed over the two feature columns rather
      # than compared on the frame.
      - name: the README's join, on the data demo wrote
        run: |
          cd /tmp/run/my_feature_store
          /tmp/quickstart/bin/python - <<'PY'
          import polars as pl
          from feather import FeatureStore
          from definitions.user_clicks import UserClicks

          store = FeatureStore("feather.toml")
          entity_df = pl.read_parquet("data/training_labels.parquet")

          training_data = pl.DataFrame(
              store.get_historical_features(
                  entity_df=entity_df,
                  features=[UserClicks.click_count, UserClicks.purchase_count],
              )
          )
          assert training_data.height == entity_df.height, "a label row was dropped"
          missing = sum(
              training_data[column].null_count()
              for column in ("click_count", "purchase_count")
          )
          assert missing == 0, f"{missing} nulls in the joined features"
          print(training_data.head())
          PY
